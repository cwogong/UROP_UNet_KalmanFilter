dataset:
  root: /home/20213103/Datasets/ANTI_UAV_RGBT/SAM
  root_mask: /home/20213103/Datasets/ANTI_UAV_RGBT/Masked_SAM
  num_workers: 4
  batch_size: 16
  image_size: [480, 480]
  train_sequences: 4
  val_sequences: 1
  test_sequences: 1
  modalities:
    - infrared
    - visible

trainer:
  epochs: 50
  optimizer: AdamW
  loss_fn: BCEWithLogitsLoss
  lr: 0.0001
  gpu_id: 0
  scheduler:
    type: ReduceLROnPlateau
    factor: 0.15
    patience: 15
    cooldown: 5
  early_stop:
    patience: 5
    min_delta: 0.001
    mode: min
  checkpoint:
    val_path: checkpoints/best-val.pth
    train_path: checkpoints/best-train.pth
    test_path: checkpoints/best-test.pth

model:
  name: VanillaUNet
  in_channels: 3
  start_out_channels: 32
  num_class: 1
  size: 4
  padding: 1

kalman:
  # Kalman filter settings
  process_noise: 0.1
  measurement_noise: 0.1