dataset:
  root: /home/20213103/Datasets/ANTI_UAV_RGBT/Masked_SAM2
  root_mask: /home/20213103/Datasets/ANTI_UAV_RGBT/Masked_SAM2
  num_workers: 0
  batch_size: 32
  image_size: [480, 480]
  train_sequences: 4
  val_sequences: 1
  test_sequences: 1
  modalities:
    - infrared
    - visible

trainer:
  epochs: 50
  optimizer: AdamW
  loss_fn: BCEWithLogitsLoss
  lr: 0.0001
  gpu_id: 0

model:
  name: VanillaUNet
  in_channels: 3
  start_out_channels: 16
  num_class: 1
  size: 3
  padding: 1

kalman:
  type: linear
  dt: 1.0
  x0: [240, 240, 0, 0]
  process_noise: 0.3
  measurement_noise: 0.5
